name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC -> AWS, no stored keys
  contents: read

concurrency: deploy

env:
  AWS_REGION: ap-south-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q backend/tests

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY DEBUG: shows what GitHub tells AWS (claims only, never the token itself)
      - name: Debug OIDC claims
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          tok = json.load(urllib.request.urlopen(req))["value"]
          p = tok.split(".")[1]
          p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print({k: c.get(k) for k in ("sub", "aud", "iss", "repository", "ref")})
          PY

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::573993262731:role/cloudvault-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform apply
        working-directory: infra
        run: |
          cp backend.tf.example backend.tf
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=cloudvault/dev.tfstate" \
            -backend-config="region=${AWS_REGION}"
          terraform apply -auto-approve -input=false \
            -var="region=${AWS_REGION}" \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}"

      - name: Build frontend
        run: |
          ./scripts/make-config.sh
          cd frontend && npm ci && npm run build

      - name: Publish frontend
        working-directory: infra
        run: |
          BUCKET=$(terraform output -raw frontend_bucket)
          DIST=$(terraform output -raw distribution_id)
          aws s3 sync ../frontend/dist "s3://${BUCKET}" --delete
          aws cloudfront create-invalidation --distribution-id "${DIST}" --paths "/*" > /dev/null
          echo "Site: $(terraform output -raw site_url)" >> "$GITHUB_STEP_SUMMARY"
